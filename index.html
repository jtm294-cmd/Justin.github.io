<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justin | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            /* Using a placeholder - update this with your chosen purple cityscape URL */
            background-image: url('./Assets/Background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #0f172a;
            color: white;
            font-family: 'Space Grotesk', sans-serif;
        }
        h1, h3, .y2k-header {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
        }
        .glass { 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.1);
        }
        /* UPDATED CROSS POSITIONS & SIZE */
        .cross-gif {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 250px !important; /* Shrunk to 50% */
            z-index: 0;
            pointer-events: none;
            opacity: 0.6;
        }
        .left-cross { left: 2vw; } /* Moved closer to edge */
        .right-cross { right: 2vw; } /* Moved closer to edge */

        @media (max-width: 1024px) {
            .cross-gif { width: 150px !important; }
            .left-cross { left: 1vw; }
            .right-cross { right: 1vw; }
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden">

    <img src="./Assets/Cross.gif" class="cross-gif left-cross" alt="">
    <img src="./Assets/Cross.gif" class="cross-gif right-cross" alt="">

    <div class="relative z-10">
        <nav class="max-w-6xl mx-auto p-6">
            <a href="mailto:jtm294@scarletmail.rutgers.edu" class="inline-flex items-center gap-2 font-bold tracking-tighter text-[10px] uppercase italic bg-blue-600/80 hover:bg-blue-500 px-4 py-2 rounded-full backdrop-blur-md transition-all border border-blue-400/50 shadow-[0_0_15px_rgba(37,99,235,0.4)]">
                <i data-lucide="mail" class="w-3 h-3"></i> Let's Connect
            </a>
        </nav>

        <main class="max-w-3xl mx-auto p-6 space-y-6">
            <section class="flex flex-col items-center gap-8 py-12">
                <div class="relative">
                    <div class="absolute -inset-4 bg-blue-500 rounded-full blur-2xl opacity-20"></div>
                    <img src="./Assets/ProfilePic.jpg" alt="Justin" class="relative w-48 h-48 rounded-full border-4 border-blue-500/50 shadow-2xl object-cover">
                </div>
                <div class="text-center p-8 rounded-3xl glass w-full border border-white/10">
                    <h1 class="text-4xl md:text-5xl font-bold mb-4 italic text-white uppercase tracking-tighter">Hello, I'm Justin.</h1>
                    <p class="text-lg md:text-xl text-blue-300 italic font-light tracking-[0.2em]">Accountancy Professional & Rutgers Alumnus.</p>
                </div>
            </section>

            <div class="p-8 rounded-3xl glass border border-blue-500/30 shadow-2xl bg-gradient-to-br from-blue-900/30 to-transparent">
                <div class="flex items-center gap-3 mb-6">
                    <i data-lucide="calculator" class="text-blue-400"></i>
                    <h3 class="text-lg font-bold uppercase text-blue-100">2026 Tax Calculator</h3>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-[10px] font-bold text-blue-400 uppercase mb-2">Gross Salary ($)</label>
                            <input type="number" id="salaryInput" placeholder="Enter Amount" oninput="calculateTax()" class="w-full bg-black/60 border border-blue-500/50 rounded-xl p-4 text-2xl font-bold text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-blue-400 uppercase mb-2">Location</label>
                            <select id="stateSelect" onchange="calculateTax()" class="w-full bg-black/60 border border-blue-500/50 rounded-xl p-4 text-lg font-bold text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition cursor-pointer">
                                <option value="none">No State Tax</option>
                                <option value="NJ" selected
