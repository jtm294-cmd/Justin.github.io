<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justin | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .dark .glass { background: rgba(15, 23, 42, 0.6); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen font-sans">

    <nav class="max-w-6xl mx-auto p-6 flex justify-between items-center">
        <span class="font-bold tracking-tighter text-xl uppercase">Justin</span>
        <button onclick="document.documentElement.classList.toggle('dark')" class="p-2 rounded-full glass">
            <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
            <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
        </button>
    </nav>

    <main class="max-w-6xl mx-auto p-6">
        <section class="flex flex-col md:flex-row items-center gap-10 py-16">
            <div class="w-44 h-44 rounded-full overflow-hidden border-4 border-blue-500/20 shadow-2xl bg-slate-800">
                <img 
                    src="./Assets/ProfilePic.jpg" 
                    alt="Justin Portrait" 
                    class="w-full h-full object-cover"
                >
            </div>
            
            <div class="text-center md:text-left">
                <h1 class="text-5xl font-bold mb-4">Hello, I'm Justin.</h1>
                <p class="text-xl text-slate-600 dark:text-slate-400 max-w-xl">
                    Building innovative solutions with high-performance code.
                </p>
            </div>
        </section>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="md:col-span-2 p-8 rounded-3xl glass">
                <i data-lucide="folder" class="mb-4 text-blue-500"></i>
                <h3 class="text-2xl font-bold mb-2">School Project</h3>
                <p class="opacity-70">A detailed breakdown of my latest academic technical endeavor.</p>
            </div>

            <div class="p-8 rounded-3xl glass flex flex-col items-center justify-center">
                <div class="grid grid-cols-2 gap-4 opacity-50">
                    <i data-lucide="github"></i>
                    <i data-lucide="terminal"></i>
                </div>
            </div>

            <a href="mailto:jtm294@scarletmail.rutgers.edu" class="p-8 rounded-3xl bg-blue-600 text-white flex flex-col justify-between hover:bg-blue-700 transition">
                <h3 class="font-bold">Have a project?</h3>
                <span class="font-bold uppercase text-xs tracking-widest flex items-center gap-2">
                    Email Me <i data-lucide="mail" class="w-4 h-4"></i>
                </span>
            </a>
        </div>
    </main>

    <script>lucide.createIcons();</script>
</body>
</html>
