<div>
    <label class="block text-xs font-bold text-blue-300 uppercase mb-2">Work State</label>
    <select 
        id="stateSelect" 
        onchange="calculateTax()"
        class="w-full bg-black/40 border border-blue-500/50 rounded-xl p-4 text-lg font-bold text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition appearance-none"
    >
        <option value="0">No State Tax (FL, TX, WA, NV, TN, etc.)</option>
        
        <option value="0.055" selected>New Jersey (Avg. 5.5%)</option>
        <option value="0.06">New York (Avg. 6.0%)</option>
        <option value="0.05">Pennsylvania (Flat 3.07% + Local)</option>
        <option value="0.08">California (Avg. 8.0%)</option>
        <option value="0.045">Connecticut (Avg. 4.5%)</option>
        <option value="0.0625">Massachusetts (Flat 5.0% + Paid Leave)</option>
        
        <option value="0.05">Other State (Est. 5%)</option>
    </select>
</div>
