<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justin | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        body {
            background-image: url('./Assets/Background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #0f172a;
        }
        .glass { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .dark .glass { background: rgba(15, 23, 42, 0.85); }
        
        .cross-gif {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 500px !important; 
            z-index: 0;
            pointer-events: none;
            opacity: 0.7;
        }
        .left-cross { left: 5vw; }
        .right-cross { right: 5vw; }

        @media (max-width: 1024px) {
            .cross-gif { width: 300px !important; }
            .left-cross { left: 2vw; }
            .right-cross { right: 2vw; }
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="text-slate-900 dark:text-slate-100 min-h-screen font-sans overflow-x-hidden">

    <img src="./Assets/Cross.gif" class="cross-gif left-cross" alt="">
    <img src="./Assets/Cross.gif" class="cross-gif right-cross" alt="">

    <div class="relative z-10">
        <nav class="max-w-6xl mx-auto p-6 flex justify-between items-center">
            <span class="font-bold tracking-tighter text-xl uppercase italic bg-black/50 px-4 py-2 rounded-lg backdrop-blur-md">Justin</span>
            <button onclick="document.documentElement.classList.toggle('dark')" class="p-2 rounded-full glass">
                <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
                <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
            </button>
        </nav>

        <main class="max-w-3xl mx-auto p-6">
            <section class="flex flex-col items-center gap-8 py-12">
                <div class="relative">
                    <div class="absolute -inset-4 bg-blue-500 rounded-full blur-2xl opacity-20"></div>
                    <img src="./Assets/ProfilePic.jpg" alt="Justin" class="relative w-48 h-48 rounded-full border-4 border-blue-500/50 shadow-2xl object-cover">
                </div>
                <div class="text-center p-8 rounded-3xl glass shadow-2xl w-full">
                    <h1 class="text-5xl md:text-6xl font-bold mb-4 tracking-tighter">Hello, I'm Justin.</h1>
                    <p class="text-xl md:text-2xl text-blue-300 italic font-light">Accountancy Professional & Rutgers Alumnus.</p>
                </div>
            </section>

            <div class="mb-10 p-8 rounded-3xl glass border border-blue-500/30 shadow-2xl bg-gradient-to-br from-blue-900/30 to-transparent">
                <div class="flex items-center gap-3 mb-6">
                    <i data-lucide="file-text" class="text-blue-400"></i>
                    <h3 class="text-xl font-bold uppercase tracking-widest text-blue-100">2026 Regional Tax Terminal</h3>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-blue-300 uppercase mb-2">Annual Gross Salary ($)</label>
                            <input type="number" id="salaryInput" placeholder="e.g. 95000" oninput="calculateTax()" class="w-full bg-black/40 border border-blue-500/50 rounded-xl p-4 text-2xl font-bold text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-blue-300 uppercase mb-2">Taxing State</label>
                            <select id="stateSelect" onchange="calculateTax()" class="w-full bg-black/40 border border-blue-500/50 rounded-xl p-4 text-lg font-bold text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition appearance-none cursor-pointer">
                                <option value="none">No State Income Tax</option>
                                <option value="NJ" selected>New Jersey</option>
                                <option value="NY">New York</option>
                                <option value="PA">Pennsylvania (3.07% Flat)</option>
                                <option value="CT">Connecticut</option>
                                <option value="MA">Massachusetts (5.0%)</option>
                                <option value="CA">California</option>
                            </select>
                        </div>
                    </div>

                    <div class="bg-black/40 p-6 rounded-2xl border border-white/10 flex flex-col justify-center space-y-4">
                        <div class="flex justify-between items-end border-b border-white/10 pb-3">
                            <span class="text-slate-400 text-xs font-bold">EST. MONTHLY NET:</span>
                            <span id="monthlyNet" class="text-4xl font-bold text-green-400 tracking-tighter">$0</span>
                        </div>
                        <div class="space-y-2">
                            <div class="flex justify-between text-[10px] uppercase text-slate-400">
                                <span>Federal Tax (2026):</span>
                                <span id="fedTaxDisplay" class="text-red-400">-$0</span>
                            </div>
                            <div class="flex justify-between text-[10px] uppercase text-slate-400">
                                <span>FICA (SS + MED):</span>
                                <span id="ficaDisplay" class="text-red-400">-$0</span>
                            </div>
                            <div class="flex justify-between text-[10px] uppercase text-slate-400 font-bold border-t border-white/5 pt-2">
                                <span>State Income Tax:</span>
                                <span id="stateTaxDisplay" class="text-red-400">-$0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="p-8 rounded-3xl glass flex flex-col sm:flex-row gap-8 items-center border border-white/20">
                    <img src="./Assets/Rutgers.jpg" alt="Rutgers" class="w-24 h-24 rounded-2xl object-contain bg-white p-2">
                    <div class="text-center sm:text-left">
                        <span class="text-blue-
