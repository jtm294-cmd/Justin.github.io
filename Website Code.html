<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justin | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Playfair+Display:italic,wght@700&display=swap" rel="stylesheet">
    
    <script>
        // Tailwind Configuration for Mesh Gradients & Dark Mode
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                }
            }
        }
    </script>

    <style>
        body { transition: background-color 0.3s ease; }
        .mesh-gradient {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.1) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.1) 0%, transparent 40%);
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .dark .glass { background: rgba(15, 23, 42, 0.6); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen font-sans">
    <div class="mesh-gradient"></div>

    <nav class="max-w-6xl mx-auto p-6 flex justify-between items-center">
        <span class="font-bold tracking-tighter text-xl">JUSTIN.IO</span>
        <button onclick="document.documentElement.classList.toggle('dark')" class="p-2 rounded-full glass hover:scale-110 transition">
            <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
            <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
        </button>
    </nav>

    <main class="max-w-6xl mx-auto p-6">
        <section class="flex flex-col md:flex-row items-center gap-10 py-20">
            <div class="relative">
                <div class="absolute -inset-1 bg-gradient-to-r from-blue-500 to-purple-600 rounded-full blur opacity-30"></div>
                <img src="ProfilePic.jpg" alt="Justin" class="relative w-44 h-44 rounded-full object-cover border-4 border-white/10 shadow-2xl">
            </div>
            <div class="text-center md:text-left">
                <h1 class="text-5xl font-bold mb-4">Hello, I'm Justin.</h1>
                <p class="text-2xl text-slate-600 dark:text-slate-400">
                    I build <span class="font-serif italic text-blue-500">innovative solutions</span> that blend code and creativity.
                </p>
            </div>
        </section>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="md:col-span-2 p-8 rounded-3xl glass hover:translate-y-[-8px] transition duration-300">
                <i data-lucide="folder" class="mb-4 text-blue-500"></i>
                <h3 class="text-2xl font-bold mb-2">School Project</h3>
                <p class="text-slate-500">A detailed breakdown of my latest academic technical endeavor.</p>
            </div>

            <div class="p-8 rounded-3xl glass flex flex-col justify-center items-center">
                <p class="text-xs uppercase tracking-widest mb-4 opacity-50">Stack</p>
                <div class="flex gap-4 opacity-70">
                    <i data-lucide="github"></i>
                    <i data-lucide="code-2"></i>
                    <i data-lucide="cpu"></i>
                </div>
            </div>

            <div class="p-8 rounded-3xl bg-blue-600 text-white flex flex-col justify-between hover:bg-blue-700 transition">
                <h3 class="font-bold">Have a project?</h3>
                <a href="#" class="mt-4 flex items-center gap-2 font-bold uppercase text-sm">
                    Book a Chat <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
                </a>
            </div>
        </div>
    </main>

    <script>
        // Initialize Icons
        lucide.createIcons();
    </script>
</body>
</html> effect.
